<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto PAEC Ecolaguna - Cobaev 01</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
--bg:#030712;
--card:#111827;
--accent:#10b981;
--text:#f9fafb;
--border:#1f2937;
--muted:#9ca3af;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:var(--bg);
color:var(--text);
}

header{
position:sticky;top:0;
display:flex;justify-content:space-between;align-items:center;
padding:15px 5%;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
z-index: 100;
}

header h1 {
    font-size: 1.5rem;
    background: linear-gradient(90deg, #10b981, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:var(--card);
border-radius:20px;
padding:30px;
margin-bottom:20px;
border:1px solid var(--border);
}

input, textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
background:#020617;
color:white;
margin-top:10px;
}

textarea{min-height:120px;resize:none}

.title{
font-size:20px;
margin-bottom:10px;
font-weight: 600;
}

.drop-zone{
border:2px dashed var(--border);
padding:40px;
text-align:center;
border-radius:15px;
cursor:pointer;
transition: 0.3s;
}

.drop-zone:hover{border-color:var(--accent); background: rgba(16, 185, 129, 0.05);}

img{width:100%;margin-top:15px;border-radius:10px}
img:not([src]) { display: none; }

.authors-section {
    margin-top: 40px;
    padding: 20px;
    text-align: center;
    border-top: 1px solid var(--border);
}

.authors-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.author-names {
    font-weight: 600;
    color: var(--accent);
}

.actions{
position:fixed;bottom:20px;right:20px;display:flex;gap:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
transition: 0.3s;
font-weight: 600;
}

.primary{background:var(--accent);color:white}
.secondary{background:#374151;color:white}
button:hover{transform: translateY(-2px); opacity: 0.9;}

.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;align-items:center;justify-content:center;
z-index: 200;
}

.modal-box{
background:#111827;padding:30px;border-radius:20px;text-align:center;
border: 1px solid var(--border);
}

.hidden{display:none}

@media print{
header,.actions,.drop-zone,.authors-section{display:none}
body{background:white;color:black}
.card{border:none; padding:10px}
}
</style>
</head>
<body>

<header>
    <h1>Proyecto PAEC Ecolaguna</h1>
    <span id="status" style="font-size: 0.8rem; color: var(--muted)">Guardado</span>
</header>

<div class="container" id="doc">
    <div class="card">
        <div class="title">Datos Generales</div>
        <input id="titulo" placeholder="Título específico del reporte">
        <input id="fecha" type="date">
    </div>

    <div class="card">
        <div class="title">Evidencia Visual (Infografía)</div>
        <div class="drop-zone" onclick="imgInput.click()">
            <span style="color: var(--muted)">Click para subir o arrastra la imagen aquí</span>
            <input type="file" id="imgInput" hidden accept="image/*">
            <img id="preview">
        </div>
    </div>

    <div class="card">
        <div class="title">Análisis</div>
        <textarea id="analisis" placeholder="Describe los hallazgos y observaciones..."></textarea>
    </div>

    <div class="card">
        <div class="title">Conclusión</div>
        <textarea id="conclusion" placeholder="Escribe las reflexiones finales del proyecto..."></textarea>
    </div>

    <div class="authors-section">
        <div class="authors-title">Código desarrollado por</div>
        <div class="author-names">
            [Nombre del Autor 1] & [Nombre del Autor 2]
        </div>
    </div>
</div>

<div class="actions">
    <button class="secondary" onclick="openModal()">Limpiar Formulario</button>
    <button class="primary" onclick="exportPDF()">Descargar PDF</button>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <p>¿Seguro que quieres borrar todo el progreso?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="primary" style="background: #ef4444;" onclick="confirmReset()">Sí, borrar</button>
            <button class="secondary" onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
function debounce(fn,delay=400){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),delay)}}

const fields = document.querySelectorAll('input, textarea');
const status = document.getElementById('status');

const save = debounce(() => {
    fields.forEach(f => localStorage.setItem('paec_' + f.id, f.value));
    status.innerText = 'Guardado';
});

fields.forEach(f => {
    f.value = localStorage.getItem('paec_' + f.id) || '';
    f.addEventListener('input', () => {
        status.innerText = 'Guardando...';
        save();
    });
});

const imgInput = document.getElementById('imgInput');
const preview = document.getElementById('preview');

imgInput.onchange = e => {
    const file = e.target.files[0];
    if(file){
        const r = new FileReader();
        r.onload = x => {
            preview.src = x.target.result;
            localStorage.setItem('paec_img', x.target.result);
        }
        r.readAsDataURL(file);
    }
}

if(localStorage.getItem('paec_img')) preview.src = localStorage.getItem('paec_img');

function exportPDF() {
    const element = document.getElementById('doc');
    const name = document.getElementById('titulo').value || 'Reporte_Ecolaguna';
    
    const opt = {
        margin: 10,
        filename: name + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    };
    
    html2pdf().set(opt).from(element).save();
}

function openModal(){document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function confirmReset(){
    Object.keys(localStorage).forEach(key => {
        if(key.startsWith('paec_')) localStorage.removeItem(key);
    });
    location.reload();
}
</script>

</body>
</html>
